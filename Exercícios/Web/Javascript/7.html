<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6</title>

    <script>
      function Calcular() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);

        let soma = a + b;

        let texto;

        if (soma > 25) {
          texto = soma + 10;
        } else texto = soma - 3;
        
        document.getElementById("resultado").innerHTML = `${texto}`;
      }
    </script>
  </head>
  <body>
    <label>A:</label>
    <input type="number" id="a" /> <br />

    <label>B:</label>
    <input type="number" id="b" /> <br />

    <br />
    <button id="botao" onclick="Calcular()">Calcular</button>

    <p id="resultado"></p>
  </body>
</html>
