<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5</title>

    <script>
      function Calcular() {
        let num = document.getElementById("num").value;
        let sinal;
        let paridade;

        if (num > 0) {
          sinal = "Positivo";
        } else sinal = "Negativo";

        if (num % 2 == 0) {
          paridade = "Par";
        } else paridade = "Ímpar";

        document.getElementById("resultado").innerHTML =
          `Número é ${sinal} e ${paridade}`;
      }
    </script>
  </head>
  <body>
    <label>Digite um número inteiro:</label>
    <input type="number" id="num" />

    <br />
    <button id="botao" onclick="Calcular()">Calcular</button>

    <p id="resultado"></p>
  </body>
</html>
