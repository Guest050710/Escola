<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6</title>

    <script>
      function Calcular() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        let c = Number(document.getElementById("c").value);

        let texto;

        if (a < b + c && b < a + c && c < b + a) {
          texto = "válido";
        } else texto = "inválido";

        document.getElementById("resultado").innerHTML = `Triângulo é ${texto}`;
      }
    </script>
  </head>
  <body>
    <label>A:</label>
    <input type="number" id="a" /> <br />

    <label>B:</label>
    <input type="number" id="b" /> <br />

    <label>C:</label>
    <input type="number" id="c" /> <br />

    <br />
    <button id="botao" onclick="Calcular()">Calcular</button>

    <p id="resultado"></p>
  </body>
</html>
